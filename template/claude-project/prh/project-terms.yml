# プロジェクトごとの表記辞書
#
# ここに書くのは「このプロジェクトで表記を揃えたい語」だけにする。
# AI が書く日本語の癖（名詞化、体言止めの連打、誇張）は
# claude-kit のスキル japanese-business-writing と
# scan_expressions.py が担当する。両方に同じ語を書かない。
#
# 追加したら、なぜ足したかをコミットメッセージに 1 行書く。

version: 1
rules:
  - expected: 記事
    patterns:
      - コンテンツ
    specs:
      - from: コンテンツを公開する
        to: 記事を公開する

  # 「同じ」を一律に置き換えると、ふつうの日本語まで指摘が出る。
  # 現行システムとの比較を指す場面だけに絞る。
  - expected: 現行と同等
    patterns:
      - /現行と同じ/
    specs:
      - from: 現行と同じ機能を提供する
        to: 現行と同等機能を提供する

# --- 固有名詞の許可リスト ---
# 誤検知させたくない語は、ここに expected だけを書いて patterns を空にはできないため、
# 表記ゆれの対応がある語だけを書く。単に許可したいだけの語は辞書に書かない。
