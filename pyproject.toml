[project]
name = "claude-kit-qa"
version = "0.1.0"
description = "Excel・PowerPoint・PDF の機械検査に使う依存をここで固定する"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1,<4",
    "python-pptx>=1.0,<2",
    "pypdf>=5.0,<7",
    "lxml>=5.0",
    "pillow>=10.0",
]

[tool.uv]
package = false
# システムの /usr/bin/python3 は Xcode の更新で起動できなくなることがあるため、uv 管理の Python を優先
python-preference = "managed"
